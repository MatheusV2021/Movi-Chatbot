<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Movi | Fisioterapeuta virtual</title>
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
   
        <div class="brand-mascot">
          <img src="assets/img/1.png" alt="Movi" onerror="this.style.display='none'; this.nextElementSibling.style.display='grid'" />
          <span class="asset-placeholder logo-placeholder">🦫</span>
        </div>
        <div>
          <h1>Movi</h1>
          <p>Seu fisioterapeuta virtual</p>
        </div>
      </div>

      <button class="new-chat" id="newChatBtn">+&nbsp; Nova conversa</button>

      <section class="recent-section">
        <p class="section-label">CONVERSAS RECENTES</p>
        <div class="recent-list" id="recentList"></div>
      </section>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <h2>Chat</h2>
          <p>Converse com o Movi.</p>
        </div>

        <div class="top-actions">
          <label class="search-box">
            <span>⌕</span>
            <input id="searchInput" type="search" placeholder="Buscar na conversa..." />
          </label>
          <button class="theme-btn" id="themeBtn" aria-label="Alternar tema">◐</button>
        </div>
      </header>

      <section class="chat" id="chatArea">
        <div class="messages" id="messages"></div>

        <form class="composer" id="chatForm">
          <div class="input-wrap">
            <span class="search-icon">⌕</span>
            <input id="messageInput" autocomplete="off" placeholder="Digite sua pergunta para o Movi..." />
          </div>
          <button class="send-btn" type="submit" aria-label="Enviar mensagem">➤</button>
        </form>

        <p class="disclaimer">♢&nbsp; As informações fornecidas pelo Movi têm caráter educativo e não substituem a avaliação de um fisioterapeuta.</p>
      </section>
    </main>
  </div>

  <script src="assets/js/app.js"></script>
</body>
</html>
