<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movi</title>
</head>

<body>

    <aside>
        <header>
            <h1>Movi</h1>
            <p>Seu fisioterapeuta virtual</p>
        </header>

        <nav>
            <button type="button">
                + Nova conversa
            </button>

            <section>
                <h2>Conversas recentes</h2>
                <p>Nenhuma conversa ainda.</p>
            </section>
        </nav>

        <footer>
            <strong>Movi</strong>
            <p>Assistente de Fisioterapia</p>
        </footer>
    </aside>


    <main>

        <header>
            <div>
                <strong>Movi</strong>
                <span>Online</span>
            </div>
        </header>


        <section>
            <article>
                <strong>Movi</strong>

                <div>
                    <p>
                        Olá! Eu sou o Movi
                    </p>

                    <p>
                        Como posso te ajudar hoje?
                    </p>
                </div>
            </article>
        </section>


        <footer>
            <form>
                <input
                    type="text"
                    name="mensagem"
                    placeholder="Digite sua mensagem..."
                    autocomplete="off"
                >

                <button type="submit">
                    Enviar
                </button>
            </form>

            <p>
                As informações fornecidas pelo Movi têm caráter educativo e não substituem a avaliação de um fisioterapeuta.
            </p>
        </footer>

    </main>

</body>

</html>
